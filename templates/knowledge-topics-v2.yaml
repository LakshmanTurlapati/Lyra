version: 2
description: |
  Knowledge topic pool for Phase 09.3 knowledge-sample generation (D-07).
  Replaces the 192-topic hardcoded pool in scripts/generate_knowledge_data.py
  that hit exhaustion at ~650 samples in Phase 09.1-04.

  Subagents pick a (topic, sub_angle) pair, then write a fresh user question +
  Sonnet-quality assistant answer in ShareGPT format. Sub-angles encourage
  variety so the same topic produces multiple distinct samples.

  Total: 7 categories x ~90 topics each = 630 topics. Each topic combined with
  6 sub-angles gives 3,780 unique (topic, angle) seeds — ample headroom for
  1,500–4,200 sample generation without prompt collisions.

sub_angles:
  - definition          # "What is X?" — core concept and scope
  - mechanism           # "How does X work?" — underlying process
  - significance        # "Why does X matter?" — real-world impact
  - comparison          # "How does X differ from Y?" — contrast with related concept
  - example             # "Give a concrete example of X" — illustrative case
  - misconception       # "What's a common misunderstanding about X?" — corrective angle

